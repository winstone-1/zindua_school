{% extends 'base.html' %}
{% block title %}Home{% endblock %}

{% block content %}
<section style="text-align:center; padding: 4rem 0;">
    <h1 style="font-size: 2.5rem; color: #1a1a2e;">{{ school_name }}</h1>
    <p style="font-size: 1.2rem; margin-top: 1rem; color: #555;">{{ tagline }}</p>
    <a href="{% url 'programmes' %}" style="display:inline-block; margin-top:2rem; padding: 0.8rem 2rem; background:#e94560; color:white; border-radius:5px; text-decoration:none;">
        Explore Programmes
    </a>
</section>

<section style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 1rem; margin-top: 2rem;">
    {% for stat in stats %}
    <div style="background:#f4f4f4; padding:2rem; border-radius:10px; text-align:center; min-width:150px;">
        <h2 style="color:#e94560; font-size:2rem;">{{ stat.value }}</h2>
        <p>{{ stat.label }}</p>
    </div>
    {% endfor %}
</section>
{% endblock %}
