<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zindua School | {% block title %}{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; color: #333; }
        nav {
            background: #1a1a2e;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a { color: white; text-decoration: none; margin-left: 1.5rem; }
        nav .logo { color: #e94560; font-weight: bold; font-size: 1.3rem; }
        nav a:hover { color: #e94560; }
        footer {
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    </style>
</head>
<body>

<nav>
    <span class="logo">Zindua School</span>
    <div>
        <a href="{% url 'index' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'programmes' %}">Programmes</a>
        <a href="{% url 'contact' %}">Contact</a>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    <p>&copy; 2026 Zindua School. All rights reserved.</p>
</footer>

</body>
</html>
