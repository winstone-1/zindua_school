{% extends 'base.html' %}
{% block title %}About{% endblock %}

{% block content %}
<h1 style="color:#1a1a2e; margin-bottom:1rem;">About Zindua</h1>
<p style="font-size:1.1rem; color:#555;">{{ mission }}</p>
<p style="margin-top:0.5rem;">Founded in {{ founded }}</p>

<h2 style="margin-top:2rem; color:#1a1a2e;">Our Team</h2>
<div style="display:flex; flex-wrap:wrap; gap:1rem; margin-top:1rem;">
    {% for member in team %}
    <div style="background:#f4f4f4; padding:1.5rem; border-radius:10px; min-width:180px;">
        <h3>{{ member.name }}</h3>
        <p style="color:#e94560;">{{ member.role }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
